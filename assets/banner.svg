<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }
      @keyframes pulseGrid {
        0% { opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { opacity: 0.15; }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .particle { animation: floatParticle 6s ease-in-out infinite; }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 2s; }
      .p3 { animation-delay: 4s; }
      .grid-lines { animation: pulseGrid 4s ease-in-out infinite; }
      .animated-stream { stroke-dasharray: 12, 12; animation: flowLine 15s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Grid Pattern Background -->
  <g class="grid-lines" stroke="#30363d" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Background Dynamic Flow Lines -->
  <path class="animated-stream" d="M -50 320 Q 300 240 600 340 T 1250 260" fill="none" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.6" />
  <path class="animated-stream" d="M -50 100 Q 400 180 800 90 T 1250 160" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Dynamic Glowing Background Nodes -->
  <circle class="particle p1" cx="200" cy="120" r="40" fill="#7c3aed" opacity="0.25" filter="url(#glowEffect)" />
  <circle class="particle p2" cx="1000" cy="300" r="50" fill="#2563eb" opacity="0.25" filter="url(#glowEffect)" />
  <circle class="particle p3" cx="850" cy="100" r="35" fill="#06b6d4" opacity="0.25" filter="url(#glowEffect)" />

  <!-- Center Card Backdrop for Content Protection -->
  <rect x="80" y="70" width="1040" height="280" rx="20" fill="#0d1117" fill-opacity="0.85" stroke="#30363d" stroke-width="2" />

  <!-- Content Container (Foreground) -->
  <g text-anchor="middle">
    <!-- Top Pill / Badge -->
    <g transform="translate(600, 115)">
      <rect x="-140" y="-18" width="280" height="34" rx="17" fill="url(#primaryGlow)" />
      <text x="0" y="4" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5">MLOps &amp; AI ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="200" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">
      Awesome Experiment Tracking
    </text>

    <!-- Subtitle -->
    <text x="600" y="250" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20">
      Curated SaaS Platforms &amp; Open-Source Tools for ML Experiment Logging &amp; Model Lineage
    </text>

    <!-- Bottom Highlights / Feature Tags -->
    <g transform="translate(600, 305)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
      <!-- Tag 1 -->
      <rect x="-330" y="-15" width="190" height="30" rx="8" fill="#21262d" stroke="#30363d" />
      <text x="-235" y="5" fill="#a78bfa">⚡ Metric Logging</text>

      <!-- Tag 2 -->
      <rect x="-115" y="-15" width="230" height="30" rx="8" fill="#21262d" stroke="#30363d" />
      <text x="0" y="5" fill="#60a5fa">📊 Hyperparameter Tuning</text>

      <!-- Tag 3 -->
      <rect x="140" y="-15" width="190" height="30" rx="8" fill="#21262d" stroke="#30363d" />
      <text x="235" y="5" fill="#38bdf8">🔗 Model Registry</text>
    </g>
  </g>
</svg>
